<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bengali OCR</title><link rel="stylesheet" href="/static/style.css"></head>
<body><div class="box"><h1>Bengali OCR</h1><form method="post" enctype="multipart/form-data">
<input type="file" name="image" accept="image/*" required><button>Predict</button></form>
{% if prediction %}<h2>{{prediction}}</h2><p>Confidence: {{confidence}}</p>{% endif %}
{% if error %}<p>{{error}}</p>{% endif %}</div></body></html>
